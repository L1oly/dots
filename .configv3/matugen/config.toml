#output_path = '~/.config/gtk-3.0/colors.css'

#[templates.gtk4-colors]
#input_path = './templates/gtk4.css'
#output_path = '~/.config/gtk-4.0/colors.scss'

[templates.firefox-website-colors]
input_path = "./templates/firefox-colors.css"
output_path = "~/.config/mozilla/firefox/xir057r7.default-release-1781872050883/chrome/colors.css"

[templates.wine]
input_path = './templates/wine.reg'
output_path = '/tmp/wine.reg'
post_hook = 'wine regedit /tmp/wine.reg'

[templates.colorscheme]
input_path = './templates/matugen.colors'
output_path = '~/.local/share/color-schemes/matugen.colors'
post_hook = '/home/l1oly/.config/matugen/post-hook-scripts/gtk-themes-reload.sh'


#[templates.cosmic]
#input_path = './templates/cosmic_theme.ron'
