#post_hook = "python .config/matugen/post-hook-scripts/cosmic_postprocess.py .config/matugen/themes/matugen_cosmic.theme.ron"

[templates.waybar]
input_path = './templates/colors.css'
output_path = '~/.config/waybar/colors.css'

[templates.swaync]
input_path = "./templates/colors.css"
output_path = "~/.config/swaync/colors.css"
#post_hook = "swaync-client -rs"

[templates.swayosd]
input_path = "./templates/colors.css"
output_path = "~/.config/swayosd/colors.css"

[templates.cosmic-greeter]
input_path = "./templates/comic-greeter.txt"
output_path = "/tmp/cosmic-greeter.txt"
post_hook = "~/.config/matugen/post-hook-scripts/cosmic-greeter.sh"

[templates.vibepanel]
input_path = "./templates/colors.css"
output_path = "~/.config/vibepanel/colors.css"

[templates.vibepanelconf]
input_path = "./templates/vibepanel.toml"
output_path = "~/.config/vibepanel/config.toml"

[templates.modernz]
input_path = '~/.config/matugen/templates/modernz.conf'
output_path = '~/.config/mpv/script-opts/modernz.conf'
